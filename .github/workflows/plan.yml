name: "Dev_Account_Plan"

on:
  push:
    branches:
      - 'feature/*'
      
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: Terraform Init
        id: init
        run: terraform init
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: cn-northwest-1
          role-to-assume: arn:aws:iam::748887400122:role/github-oidc
